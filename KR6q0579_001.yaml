body:
  text: 繼住龍山華嚴院嗣法門人行悟等編次住山西汾州府汾陽縣普通禪寺上堂師於康熙壬子秋受護法紳紟洎兩序闔院大眾請於十月望日進院山門潑天門戶八字打開要入便入本無疑擬拽杖便入伽藍新長老入院舊伽藍生喜海眾辦道心身命全賴你韋馱三洲感應驅魔業十世童真護法門今日長老親到此互相扶起破沙盆祖師折葦渡江也是你隻履西歸也是你將謂有多少伎倆咄原來也只在這裏佛殿入門須辨主端的甚分明今古誰敢敵三界獨稱尊遂展具拜方丈既到此地當仁不讓佛來魔來盡教喫棒且道新長老具何手眼有如是作略乃卓拄杖一下曰區區七尺烏藤敢作人天榜樣指法座過去燈王亦陞斯座現在新長老亦陞斯座且道過去底是現在底是喝一喝曰高著眼便陞座拈香祝聖畢次拈香曰此一瓣香有主有賓有權有實放下也地搖六震拈起也天雨四花耑為供養江南揚州泰興覺華堂上五住道場傳曹洞正宗第三十世無鼻孔沒意思竹浪本師老和尚用酬法乳維那白椎竟揮拂子曰爐鞴宏開烹佛鎔祖鉗鎚纔舉轉凡成聖即今還有不入爐鞴非藉鉗鎚底衲僧出來與新長老拄杖子相見問凡夫因甚迷師曰過河須用筏曰聖人因何悟師曰到岸不須舟曰脩行有何功德師曰種荳不生麻曰作惡有何過師曰栽瓜不結荳曰向上又作麼生師便打問如何是道師曰家家門口有曰如何是戒定慧師曰水流濕火就燥曰如何是佛師曰三十二相八十種好曰如何是法師曰作賊怕拷欠債怕討曰如何是僧師曰穿衣喫飯曰三寶今已曉祖意更如何師曰錯過目前機問如何是普通境師曰門前官大路東西任往來曰如何是境中人師曰箇箇眉毛眼上橫曰人境交馳又作麼生師曰山門前合掌佛殿裏燒香曰人境已蒙明指示向上宗乘事若何師曰待露柱生兒向你道僧喝師便打曰著急作麼問如何是正中偏師曰銅壺滴漏五更前如何是偏中正師曰一條拄杖行正令如何是正中來師曰燄裏蓮花朵朵開如何是兼中至師曰石虎當途踞如何是兼中到師曰木人撫掌笑曰正偏兼帶分明示濟宗賓主又如何師喝僧禮拜師便打乃曰問在答處答在問處有時問不在答處答不在問處自然一一箭鋒相拄函蓋吻合機機應的法法圓成所以作家不啐啄啐啄即同時有如此眼目有如此作略一任破趙下燕定漢收楚橫行天下約法三章然句能鏟意意能鏟句意句交馳是為可畏則雙明雙暗同生同死於此明得紀信乘彩輦於此不明項羽失烏錐楷上座今日不惜口業露布機宜暗投信符若是聞一知十舉一明三底英靈衲僧便橫趨而去何必向三條椽下七尺單前一箇箇覓甚麼碗維那結椎下座綿山永寧菴別雲法兄和尚領慧本二禪座設齋請上堂師豎拂子召大眾曰看看若喚作拂子頭上安頭若不喚作拂子掘地覓天若道拈來便用何異擔雪填井若道總不與麼也是證龜成鱉縱饒直下承當猶是化城境界畢竟喚作甚麼良久曰寰中天子敕塞外將軍令舉僧問洞山如何是佛山曰麻三觔僧問雲門如何是佛門曰乾矢橛僧問趙州如何是佛州曰殿裏底僧問首山如何是佛山曰因我得禮你此四轉語內有一句能縱能奪能殺能活若能辨得一生參學事畢且道是那一句喝一喝裂破一任著眼看下座綿山永寧菴別兄和尚領達蒲眾居士設齋請上堂師揮拂子曰一向把定牢關今日放開一線倘有伶俐衲僧便請出來相見問佛未出世時如何師曰白鷺下田千點雪曰佛出世後如何師曰黃鶯上樹一枝花曰如何是宗乘向上事師曰向上問將來僧佇思師曰慮而知思而解猶是鬼家活計問如何是不二法門師曰天左旋地右轉僧禮拜師打曰何不進語問不得有語不得無語請師速道師曰山僧被你一拶直得立地放尿僧禮拜師曰多蒙上座見諒乃曰松直棘曲鵠白烏玄竹連雲綠花映水紅九九八十一六六三十六若作佛法商量猶在半路若作世諦流布且宿草菴詎知雲門拄杖子𨁝跳上三十三天觸著帝釋鼻孔東海鯉魚打一棒雨似盆傾且道跛腳阿師這道真言是何宗旨直饒向這裏了了分明更買草鞋行腳三十年來好喫普通拄杖子何故頂𩕳未具千聖眼目前怎透法王機舉臨濟大師示眾曰若第一句中薦得堪與佛祖為師若第二句中薦得堪與人天為師若第三句中薦得自救不了時有僧問如何是第一句濟曰三要印開朱點窄未容擬議主賓分如何是第二句濟曰玅解豈容無著問漚和爭負截流機如何是第三句濟曰但看棚頭弄傀儡抽牽全藉裏頭人臨濟雖將祖翁田地分疆立界普通猶且不然若向我法兄未離綿山時薦取雙瞎若向已降達蒲時薦取雙開若向正入普通時薦取半瞎半開設有人問未離綿山時如何山僧向他道獅子遊行芳草綠已降達蒲時如何象王回顧落花紅正入普通時如何孔懷兄弟元無二同氣連枝各自榮諸兄弟且道楷上座恁麼說話與古人是同是別若道是同未免儱侗真如若道是別又是顢頇佛性畢竟作麼生良久曰三腳驢子弄蹄行卓拄杖下座師因事告疾不語兩序固請開語上堂山僧打箇不語七一句話也參不出無明滿肚實難灰累劫煩惱纏不徹兩輪日月逝如梭百歲光陰似箭急明歷歷黑漆漆己躬下事何曾畢兩箇啞子笑呵呵誰知笑裏生荊棘一箇要喫川黃連一箇要喫廣白朮甜苦只許自家知總有知心道不出麻三觔乾矢橛大地山河一片雪夜半鐵牛過西河無端踏破水中月黎明杲日麗中天萬里無雲光皎潔分付東村李樵子子細好對石女說切忌將心去覓心休要去本反求末秖求本不求末無手人擎沒底缽一任廬陵米價高要且金牛飯自熟大家喫得飽齁齁連柄椎兒打不脫打得脫從教東說與西說若還撞著莊老師拶得通身都是血絕後甦來不自欺珊瑚枝枝撐著月良久以拄杖地上畫此相曰三十二人齊勘破空床高臥維摩詰元旦上堂師揮拂子曰昨日臘月三十今朝新正初一西舍有箇王大姐借婆帔子拜婆節南無佛陀耶南無乾矢橛赤肉團上有一無位真人常在汝等面門出入直饒於此會得也是秤鎚裏呷汁且道如何是腳跟下事吽吽吽咄咄咄拈拂子作此相新年把筆百事大吉下座解制上堂拈拄杖曰獅子教兒迷子法向前躑跳解翻身於中若有真獅子兒不妨出來哮吼看問透網金鱗還有喫棒分也無師曰山高日出遲曰與麼則禹門浪裏翻觔斗一聲霹靂震山河師曰海闊浪來高曰龍得水時添意氣虎逢山勢長威獰師打曰賞你重說偈言問桑樹上斫一刀柳樹上去塊皮此意如何師曰南山雲起北山雨曰如何是猢猻倒上樹師曰笑殺旁觀問如何是殺人刀師曰山僧聞得也害怕曰如何是活人劍師豎拂子曰是甚麼僧喝師曰果然果然問如何是趙州茶師曰飯後少他一杯不得曰如何是金牛飯師曰美食不中飽人餐問如何是海底龍師曰興波不作浪曰如何是龍中寶師曰莫將眼來見曰光寶俱亡時如何師曰瓦解冰消問四大未生時如何師曰鼻孔大頭向下垂曰四大已生時如何師曰眉毛眼上橫曰生與未生蒙師指洞山偏正意如何師曰舌頭不出口曰恁麼則雲散天寬碧月皎照千峰師曰閒言語問前後際斷虛空消殞時如何師曰水清魚現曰只得魚水相忘去也師曰萬里一條鐵問如何平常無生句師曰開口即錯如何玄玅無私句師曰動念即乖如何是體明無盡句師曰若不是居士管教髑髏粉碎乃曰九旬把斷重關不容絲毫走作直教箇箇徹底掀翻人人皮毛脫落子細檢點將來也是千錯萬錯今朝不免放開一線一任東來西往彼此無拘無束騰騰任運任運騰騰觀山玩水隨處翛然雖然如是忽遇鑊湯爐炭劍樹刀山未審如何迴避良久曰眾苦不能到舉芙蓉一日告辭馬祖祖曰裝卻包了來與你說一上佛法芙蓉於次日上方丈侍立少頃祖曰時寒善為道路芙蓉至法堂上忽然有省師曰馬祖縱有起死回生之金丹怎奈遇斯等人反成毒藥芙蓉雖於馬祖言下悟去也只是悟得箇時寒善為道路若論佛法猶未夢見在今日如有人告辭痛與三十棒設有旁不甘者出來道過在甚麼處普通向伊道一任舉似諸方下座辭院上堂師曰一山難藏二虎有你勝似有我正與麼時門裏出身一句作麼生道腳尖踢破五須彌杖頭白雲千萬朵曳杖便行上堂問寒暑到來如何迴避師曰不迴避曰為甚不迴避師曰寒時任他寒熱時任他熱曰恁麼則被寒暑推遷去也師曰隨他推遷也不惡問悉達才生時如何師曰指天顧地曰雲門道我當時若見一棒打殺與狗喫貴圖天下太平又作麼生師曰不是知音者徒勞話歲寒曰和尚作麼生師曰貶向無生國問如何是向上事師曰東墻腳底有乃舉僧問洞山寒暑到來如何迴避山曰何不向無寒暑處去僧曰如何是無寒暑處山曰寒時寒殺闍黎熱時熱殺闍黎又僧問老宿時節恁麼熱向甚處迴避宿曰向鑊湯爐炭裏迴避僧曰鑊湯爐炭裏如何迴避宿曰眾苦不能到師曰二尊宿一人向寒暑內作大佛事一人向寒暑外作大佛事寒暑內作大佛事者不知有寒暑寒暑外作大佛事者通身是寒暑普通恁麼道諸人還信得及麼若信得及離中虛坎中滿如信不及冬寒夏熱但恁麼過下座上堂舉香巖曰去年貧未是貧今年貧始是貧去年貧有卓錐之地今年貧錐也無真淨曰去年富未是富今年富始是富去年富惟有一領黑黲布衫今年富添得一條百衲袈裟歲朝抖摟呈禪眾實謂風流出當家師曰香巖貧未是貧奈何猶有這箇身真淨富未是富家私未免全拋露普通這裏不言貧寧論富百年三萬六千朝隨家豐儉埋頭過適有箇俊俏衲僧出來道好箇說無字禪底長老向他道曾憶王老師不打這破鼓下座住白雲禪寺南巖頂玄二禪德率緇素等請上堂至座前師曰佛身充滿於法界普現一切群生前隨緣赴感靡不周而恒處此菩提座汝等諸人還見佛身麼設若未見楷上座開大方便令諸人一恁飽足觀光便陞座拈香曰此一瓣香彌綸六合充塞四洲恭為祝延今上皇帝聖壽無疆次拈香曰此一瓣香根盤實際理地葉茂佛事門中伏為滿朝文武合省宰官又拈香曰此一瓣香描也描不成畫也畫不就惟願護法大檀諸山耆宿今晨請主共證真空同明般若復拈香曰此一瓣香常在動用中動用中收不得第二回拈出耑為供養維揚泰興縣覺華堂上傳曹洞正宗第三十世竹浪本師和尚用酬法乳維那白椎畢乃揮拂子曰未陞座前已過去已陞座後猶未來正當陞座時何必強安排既不安排眾中還有向腳跟下道得一句底麼設有出來道看問如何是第一玄師曰石女夜半繡鴛鴦如何是第二玄師曰木人日午歌雪曲如何是第三玄師曰無手人撐沒底船如何是第一要師曰出則便出入則便入如何是第二要師曰語則便語默則便默如何是第三要師曰喫則便喫穿則便穿僧擬進語師曰三玄三要猶閒事腳跟下親切道一句來僧喝師曰未有主在僧又喝師打曰果然問經中道惟此一事實餘二則非真且道是那一事師曰白雲也不知曰和尚是悟底人為甚不知師曰莫謗白雲好僧禮拜師曰切忌舉似人問如何是隨波逐浪句師曰落花已隨流水去如何是截斷眾流句師曰流水無情戀落花如何是函蓋乾坤句師曰鼻孔朝天腳跟點地曰三句即一猶難曉一句具三請師分師按拄杖僧擬議師便打問不是心不是佛不是物是箇甚麼師曰好箇問頭曰是心是佛是物又作麼生師曰莫妄想乃拈拄杖曰這箇是佛又喚甚麼作拄杖卓一卓曰這箇是拄杖又喚甚麼作佛直饒坐斷兩頭未是衲僧極則事如何是衲僧極則事復卓兩卓曰莫妄想舉臨濟大師初住鎮州一日謂普化克符二上座曰我欲於此建立黃蘗宗旨汝二人成褫我師曰鉤頭著餌二人珍重下去師曰且道成褫不成褫三日後普化上來問臨濟曰三日前道甚麼師曰逆風鼓浪濟便打師曰寰中天子敕三日後克符上來問臨濟曰三日前為甚打普化師曰順水放舟濟亦打師曰塞外將軍令今日新白雲則不然我欲於此建立覺華宗旨汝等諸人若肯成褫我痛與三十棒不成褫我亦痛與三十棒為甚如此只要據虎頭把虎尾向第一句下明宗旨卓拄杖三下維那結椎下座上堂師曰臨濟在黃蘗三度問佛法的的大意三度被打諸兄弟還會得此意也未直饒會得不是伶俐漢後見大愚言下知歸脅下還拳且道還悟也未縱若悟得正好喫棒已立百尺竿頭更進一步懸崖撒手自肯承當更買草鞋行腳且道過在甚麼處有佛處不得住無佛處急走過三家村裏土地十字街頭石敢當在安泰橋上商量了一夜且道說底是甚麼熱大唵㗭唎耶娑訶卓拄杖下座上堂問三世諸佛出興且道說箇什麼師曰東瓜直儱侗曰歷代祖師談玄傳法又傳箇什麼師曰瓠子曲彎彎曰天下善知識以何為人師曰賊把贓來驗曰今日和尚陞座施何法要師曰拄杖長七尺曰恁麼則棒頭有眼明如日要識真金火裏看師便打僧禮拜問文殊是七佛之師為什出女子定不得師曰鋸窮木斷曰罔明菩薩為甚出得女子定師曰水到渠成乃曰三世諸佛是劫賊歷代祖師是魔軍一切善知識說黃道黑皆是佛口蛇心欺天瞞地天下衲僧把髻投衙今日眾中還有超群拔萃大丈夫向威音那邊更那邊為宗門出一隻手眼者麼設或有之秖好明窗下安排袖米供養上堂問一毛頭上現寶王剎坐微塵裏轉大法輪今日和尚高登猊座請師轉大法輪師靠拄杖不顧曰昔日維摩默然文殊讚善和尚默然與維摩是同是別師亦不顧曰與麼則四眾霑恩有分師亦不顧又僧問師總不顧僧罔措而退乃曰拈椎豎拂望梅止渴談玄說玅畫餅充饑一問一荅擔雪填井行棒行喝無事生事直饒把斷要津不通凡聖若到白雲門下一點也用不著且道白雲有甚麼長處良久曰自有一雙窮相手不曾容易舞三臺下座上堂左右顧視拈拄杖指東邊曰這邊總是菩薩指西邊曰這邊盡是羅剎羅剎裏有一菩薩菩薩裏有一羅剎若識得此二人山僧不敢輕慢汝等汝等皆當作佛便起身上堂師曰直指人心心是佛不知此心是何物內外中間覓總無動轉施為明歷歷心生種種法自生心滅種種法自滅生滅之中覓此心覓到驢年也未徹若道此心有生滅未免自造無間業若道此心無生滅正是望空去著橛心生不知何處生心滅不知何處滅截斷生滅兩條心一顆明珠光皎潔上堂師曰若論此事山僧未出方丈時拄杖子一片婆心盡情向諸人道破了也若然不會不妨出來與拄杖子商量看問如何是學人本來面目師曰耳朵兩片皮曰不會師曰是你髑髏上事也不會問如何是萬法歸一師曰東山高西嶺低曰畢竟一歸何處師曰南山長北山短磨頭問如何是本來面目師曰八角磨盤空裏走曰恁麼則不下也師曰話頭也不識曰百雜碎師打曰又道不下乃曰三世諸佛出世原為此一大事因緣歷代祖師出世也為此一大事因緣天下善知識出世也為此一大事因緣且道喚甚麼作大事因緣莫是上堂陞座秉拂小參麼莫是拈椎豎拂瞬目揚眉麼莫是行棒行喝擎拳豎指麼莫是拈今頌古荅對吟詩麼若是門庭施設則不無若是入理深談一點也用不著何也此事不可以智知不可以識識非玄非玅非正非偏非有非無非一非多非長非短非物非人不見古人道恁麼也不得不恁麼也不得恁麼不恁麼總不得且道如何方是
