body:
  text: 繼住龍山華嚴院嗣法門人行悟等編次小參小參釋迦老子道若有一人發真歸元十方虛空悉皆消殞龍山即不然若有一人發真歸元十方虛空水泄不通且道與迦文是同是別同則喫粥喫飯別則屙矢放尿喝一喝曰也是雪上加霜小參僧出請問和尚昔日九峰虔具甚麼眼不肯首座師曰寰中天子敕曰首座道明一色邊事還有過也無師曰箭穿紅日影曰香煙才起首座脫去又作麼生師曰可知禮也問牛頭未見四祖為甚天人送供師曰雲無心以出岫曰見後為甚不送供師曰鳥倦飛而知還曰學人不會師曰龍山也不會乃舉九峰虔在石霜為侍者因普會遷化衆舉首座住持虔曰須明得先師意始可住持先師道一念萬年去古廟香爐去冷湫湫地去一條白練去首座作麼生會座曰明一色邊事虔曰未會先師意座曰裝香來我若不會先師意香煙起處脫不去及香煙才起首座脫去虔撫座背曰坐脫立化即不無首座先師意未夢見在師曰虔侍者秖有殺人刀且無活人劍首座坐脫立亡秖解恁麼去不解恁麼來雖然如是且道虔侍者還會先師意麼具眼者試定當看直饒定當得出我更要問你先師畢竟是甚麼意果然大法明底人舉起便知落處不然八十翁翁入場屋真誠不是小兒戲下座小參夫欲學禪道佛法第一不得求奇特玄妙若求奇特玄妙於道則千里萬里亦不得作無奇特玄妙想若作無奇特玄妙想定墮在無事甲裏所以古人道無為無事人由是金鎖難若論此事有不得無不得是不得非不得取不得捨不得若起有無得失是非取捨心便是識神用事古德云損法財滅功德莫不由茲心意識若向心意不行智識不到處直下提起話頭如何是佛乾矢橛自然銀山粉碎絶後再蘇更不疑天下老和尚舌頭雖然如是若到龍山門下正好喫棒且道過甚麼處到江吳地盡隔岸越山多貼單小參父母未生前佛眼覷不見若是伶俐漢作急知機變喝一喝曰還會麼設若不會且待須臾管保一個個露頭露面曰事小參出家兒休妄動莫向人前乾打鬨兩丸日月快如梭百歲光陰如一夢早回光急返照心王休被六賊鬧直下剔起智慧燈時時常行菩薩道尊乎道美乎德方寸莫教鬼神測一念不生萬法空定慧圓明珠不失珠不失奉佛戒佛子休把根本壞多見棄賊學禪宗他日入魔王界學禪宗不求悟終朝秖喫人涕唾談玄説妙答機鋒莽莽蕩蕩招殃禍戒定慧三件事缺一便是僧中刺喜怒哀樂在其中自然事上通無事理無礙事無礙理事圓融無內外事事無礙恁麼行是則名為觀自在説要行行要到行説俱到方為妙若還心口不相應地獄三途人自造勸禪人休妄想妄想才生煩惱長八萬四千障門開生生難脫輪回網輪回網君自脫大智若愚巧若拙對境無心不自欺紅塵堆裏活潑潑活潑潑事事了信手拈來正恰好一毛頭上現瓊樓丈六金身一莖草浴道河歸小參做了十年長老方知一百二十月之錯直饒今日不錯奈何時時有過百年三萬六千朝朝朝日月頭上過過不過休死坐不到浴道河焉知水推磨為耆宿省法當晚小參德山晚參不答話問話者三十棒龍山晚參答話去也衆中還有問答者麼有則不用如何若何便請單刀直入衆問話竟乃顧左右曰山僧在汾陽州內十數年來作得個木作頭斧鑿似虎錛鋸如龍本圖深山大林裏覓一梁一柱要向東山砍未免犯國王疆界要向西山伐未免犯國王疆界終日隨分向溝頭裏田畬邊砍些荊棘蓬蒿非但蓋房造屋連一廚一灶也供不上昨日無端誤入萬仞峰頭懸崖之下腳尖頭踢著一顆大枯樁雖不堪作梁作柱且喜一冬燒不盡諸昆仲還識枯樁麼良久曰呀卓拄杖下座梁居士臨別與師相訂曰弟子有蝸茅林壑幽邃殊為道人住處倘不相嫌飛錫敝邑可了弟子末後大事亦悉鄙願師越明年回南之楚過黃麻城白皋鎮謁中斗梁公公喜甚不爽前約固留請住鳴山獅子巖度夏小參龍麓高懸楖栗鳴山放下蒲團一個菴無內無外兩重關天寬地闊正可謂飽看松雲臥聽澗水鳥銜花落碧巖前猿抱子歸青嶂裏農歌遞枕牧唱穿林此境秖可自知難與人道恁麼行也任我行住也任我住坐也任我坐臥也任我臥且道得何三昧有此受用不見道一動不如一靜設問靜後如何宇宙獅巖窟天地象王宮喝一喝卓拄杖下座師五十誕辰小參彈指行年半百好房住作破屋菩提路上轉生世法場中偏熟早起日食三餐夜來埋頭一宿仁義道德不知煩惱無明滿腹一味眼界無人胸中沒點文墨設遇師友提攜不肯低頭稟伏子細檢點將來空在人間受祿從前虛喪光陰自慚形如朽木有志欲效先賢何期精神不足叮嚀告報禪人莫笑龍山薄福徹健禪人為師祖請對靈小參昔日耳聞今朝日睹覿面相逢聊通一線且道這一線作麼生通柳中鸚鵡噪方知雪裏鷺鷥飛始見木馬嘶風去不回鐵牛拖犁耕水面龍山恁麼語話恆菴法主還肯點頭也無喝一喝曰簷聲不斷前旬雨電影猶連後夜雷卓拄杖下座為張二居士對靈小參我來此邑你不離我遽爾西歸大家散夥咄休散夥撫掌呵呵歸去來勘破禾山解打鼓正恁麼時張二居士在甚處安身立命良久曰足下白雲千萬朵衆善友為武相臺設供請小參生見其形一靈皮袋皮袋一靈覿面相呈落花有意流水無情截斷生死兩重關月在青天水在瓶今晨衆善友特請山僧説法為作證明且道武公還來受供也無良久曰有水皆含月無山不帶雲弘舟上人起棺小參不參禪不持戒一句彌陀常自在今朝脫卻這皮囊撒手西歸無罣礙澄明大德對靈小參來時明歷歷月照碧潭光皎潔去時黑漆漆九九原來八十一踏翻來去兩重關捏出稱錘黃金汁澄明大德即今神通作麼生施展卓拄杖曰雙雙木馬嘶風去引得虛空笑點頭侯吉祥居士薦嚴請小參諸行無常雲在嶺頭間不徹是生滅法水流澗不太茫生生滅滅已竹密不妨流水過寂滅為樂山高豈礙白雲飛若能於此會得始知生也未常生滅也未常滅既無生滅去來則隨緣任運優遊放曠一句作麼生道以拂子擊案曰塵塵極樂國剎剎總蓮邦小參參學人出一叢林入一保社親近知識必須要化氣質改性情去能所除我見斷無明絶是非少可有參學分矣今冬諸兄弟多有幾千里來發向上心求菩薩道未入龍山門時便有立地成佛底心及乎到龍山進了堂放下腰包要一個善用心底人也無一出一入皆在情識上做活計舉目動靜是非好歹一點也瞞你不得古德云才有是非紛然失心曠劫以來者一點偷心死不盡輪回三界轉驢胎入馬腹皆為識情紛擾之所招也諸兄弟要參龍山禪將你向來册子上學得底心意識邊想得底盡情拈向一邊單單看一個無意味底話頭於日用中時刻不可放過直待心死路絶要一點氣息也無休管悟不悟直恁猛烈疑將去參將去參到不參而自參不疑而自疑拶到百尺竿頭進不得退不得住不得向這裏忽然㘞地一聲緩緩地睜開兩眼依然只是舊時人秖改舊時行履處更不疑天下老和尚舌頭即不無若在龍山門下向你道未在何故不見道欲窮千里目更上一層樓小參舉古德曰莫行心處路不挂本來衣何須正恁麼切忌未生時去此四途還有商量分也無諸兄弟若有不妨與山僧商量看問婆子燒庵意旨如何師曰來者不善答者有餘典座問乾矢橛意旨如何師曰醋是醋味鹽是鹽鹹座禮拜師曰是世法是佛法座擬議師打曰料你分疏不出剃藏頭僧出問世尊未離兜率已降皇宮未出母胎度人已畢此意如何師曰刀刮頭皮痛問庭前柏樹子是何意旨師曰今日好大雪問如何是親切處師曰髼髼鬆鬆曰如何是落腳處師曰拳拳攣攣乃曰即心即佛頭上安頭非心非佛斬頭覓活不是心不是佛不是物正是棄本求末如何是祖師西來意庭前柏樹子如何是佛乾矢橛直恁麼會去也是抱贓叫屈方便門中即不無若論衲僧本分料掉沒交涉且道如何是衲僧本分倦來開單醒來喫飯清水洗鉢漱口喫茶南方一九二九家家沿河插柳今冬數九已來天氣漸溫山僧也想種幾株昨日向溝頭裏河岸邊走了一轉盡天地凍得生鐵相似縱有鋼鍬利钁用盡平生氣力直是穵砍不入顧左右呵呵大笑曰罷罷罷下座小參師喚僧來僧近前乃曰會得那邊事向這邊行履如何是那邊事曰鐵牛水上行師曰如何是這邊行履事曰喫飯穿衣師曰截斷兩頭又作麼生曰三門騎佛殿師咳嗽一聲僧無語師曰好一場曲調被山僧咳嗽一聲便瓦解冰消問不是心不是佛不是物是甚麼師曰小雪流凌曰意旨如何師曰大雪凍河乃曰諸人欲學斯道必須要善用其心近來學者不善用心者極多所以不能死心做工夫終日只在心意識上作活計永嘉道損法財滅功德莫不由茲心意識心意識乃是障道魔軍龍山與你截斷心意識你又無處下手不是昏沉定是掉舉不是掉舉定又坐在無事甲裏要半點疑情也無又古人道大疑大悟小疑小悟不疑不悟究竟諸兄也不知疑情之所以然秖在知解上作活計知解才生依舊落於心意識欲得真疑現前必須萬緣放下動靜兩忘外不知有身內不知有心亦不得坐在不知處向這裏提個無意味底話頭朝撕暮捱一時不得放過直捱到無下手處沒滋味處心死路絶處連絶也不知工夫做到這裏才喚作疑情疑情一起面前如銀山鐵壁相似向前不得退後不得左不得右不得昏悶殺人已立百尺竿頭更進一步直得懸崖撒手自肯承當絶後再蘇欺君不得然雖如是切忌坐在前後際斷處恐死了不得活何也巖頭道未得個入頭處必須求個入頭處已得個入頭處必須求個出頭處且道作麼生是出頭處驀按竹篦顧左右喝一喝曰雲散家家月春來處處花造藏經閣破木小參拈拄杖乃卓一下曰普庵到此百無禁忌紫微高臨千祥駢集任他諸煞到來直得退避三舍復豎拄杖召曰大衆吉祥王菩薩在山僧拄杖頭上高聲道今日破木良辰諸佛龍天悉皆歡喜稱善不日工成錢糧雲委又卓一下曰謝聖屈臨有勞神用魏允彝居士薦慈請小參諸行無常竹密不妨流水過是生滅法山高豈礙白雲飛生滅滅已木人執板雲中拍寂滅為樂石女含笙嶺外吹正恁麼時且道魏母王氏孺人在甚麼處喝一喝曰直下西方休那步遍界蓮邦歸去來為李善友小參塵勞中生佛地上死有因有緣無彼無此既無彼此且道李善友一口氣不來向甚麼處安身立命泥牛鑽入海木馬逐風嘶為張居士紹先對靈小參師曰我來遲法堂前草深一丈公去早出門茫茫皆是草親恩未報已先歸撒手長空日杲杲自性彌陀秖者是淨土蓮邦休外討於此明得一雙孤雁撲地高飛於此不明一對鴛鴦池邊獨立所以道我無一切心何用一切法乃震威喝曰且道是法耶是心耶張居士試定當看驀豎拄杖良久曰三月江南春氣暖鷓鴣啼處百花香過亳州為山西汾陽曹翰英居士對靈小參乃舉古德曰五蘊山頭一段空同門出入不相逢無量劫來賃屋住到頭不識主人翁曹居士還識主人翁麼若曰識得又不相逢既不相逢且道問甚麼人賃豎拂子曰會麼若道是拂子喚甚麼作主人翁若道是主人翁又是拂子於此明得相逢卻不識不識卻相逢主人翁即是拂子拂子即是主人翁無彼無此無得無失方與這老宿同一鼻孔雖然生意各別養家一般究竟檢點無一字提起有千般此陰滅時彼陰生彼陰生時此陰滅龍山也是因行掉臂即今仰勞大衆為曹老居士唱個還鄉曲調衆乃舉贊晚參晚參乃拈拄杖畫一畫良久曰會麼識得一萬事畢且道未畫已前是什麼字諸兄若向這裏會得許你具半隻眼設若不明禮拜了再向諸人道一衆作禮師起身歸方丈晚參聞鼓聲