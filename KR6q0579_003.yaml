飽誰倦誰困海底紅輪山頭浪滾十字打開要論便論師歸方丈士隨後入呈棒喝見解師不肯士深疑至三鼓上方丈叩門師曰誰士曰者老漢幾被你瞞師曰你且下去士回至黎明復上方丈禮謝師曰淨面了也未士曰淨了師曰喫滾水了也未士曰喫了師曰依舊可憐生和聲便打士曰和尚意作麼生師便喝士亦喝師便打士亦打師曰我也打你也打其中意作麼生士又喝師曰適來打而今喝干他甚麼事士禮拜師笑曰也不得亂做示衆一句合頭語萬古繫驢橛伶俐衲僧聞得便行曰將謂普通有多少奇特原來只在這裏且道這裏是甚麼所在直饒翻轉面皮正好朝打三千暮打八百師一日見二鴉相打示衆古人道聞聲悟道見色明心龍山即不然聞聲失道見色迷心此語有兩負門若能辨得許伊開一隻眼若辨不得即瞎卻一隻眼若要全開全瞎直須問取二老鴉喝一喝示衆要參了生脫死底禪第一不得收拾外邊事何故從門入者不是家珍向外馳求亦非妙道亦不得向心意邊作活計不見古德道損法財滅功德莫不由斯心意識到這裏直得外不放入內不放出不入不出不定不亂心等虛空亦不得作虛空想才作空見即不空也又不得坐在空處若坐在空處便是落空亡底外道魂不散底死人正與麼時如盲人上高山相似上到萬仞崖前忽然失腳一撲到底直得通身粉碎款款地睜開兩眼始信永嘉曰無明實性即佛性幻化空身即法身法身覺了無一物本原自性天真佛非誑語也示衆參學人必須心要應口行要越志近來學者口是心非志虧行短二六時中少有不如意處人我山摩天是非心塞海所以古人道一念無明起八萬障門開將此大事因緣拋向大洋海裏無明習氣挂在眉毛尖上如此參學參到彌勒下生終不能得悟若是真實學道人不得自欺自瞞通身放下一點氣息也無從朝至暮如木石相似只知飢來喫飯倦來打眠看一個無意味話頭行住坐臥不可放過日久月深忽然磕著撞著噫元來此事不從人得方知吾不汝欺示衆參禪一事原無奇特玄妙才有絲毫求奇索異之心早已墮坑落塹了也須當內安其心外安其身萬緣放下行住坐臥平平常常將個乾矢橛樹在面前忽然打破漆桶識得自己本命元辰落著處不是差事示衆學道之人外要身間內要心靜也不得太過也不得不及太過則精神不繼不及則道業難成但將太過與不及拈在一邊然後咬定本參看他必定是個甚麼意旨驀地坐斷兩頭中間不立自有少分相應示衆龍山昨日心上靜悄悄地如木人相似休説雜念紛飛要求一念起處也不可得今朝心上鬧浩浩地將塵剎以來事一時現前更有思不來想不去底雜念紛飛無如奈何山僧只得端身正坐用力排遣正排遣時推又推不開歇又歇不下覓他起處又不可得正恁麼時忽聽堂中開靜山僧不覺放倒身心一覺睡到天明開眼看時日已三竿諸昆仲且道昨日底是今朝底是若道昨日底是昨日靜悄悄是無心古德曰無心猶隔一重關若道今朝底是今朝鬧浩浩是有心古人曰有心用處還成錯若道是則總是非則總非便是儱侗真如顢頇佛性正好弔向三門外打三十苕帚畢竟如何咄若不同床睡焉知被底穿示衆乃拈拄杖畫一圓相曰會麼盡虛空是一個禪堂遍法界是一張禪床經行坐臥喫飯穿衣屙屎送尿全身在裏許若道不在裏許也是個開眼尿床鬼子若道在裏許莫道不疑好所以古人道大疑大悟小疑小悟不疑不悟千疑萬疑秖是一疑一疑若破千疑萬疑一時破若論今冬做工夫在諸兄分上也算十分用心在山僧分中看諸兄要一個真疑現前底也無終日磨褌擦褲晝三夜三秖在心意識上作活計然此心意識正是學般若底障道魔軍山僧大開方便與你奪了心意識及至心意識不行諸兄又墮在無事甲裏心上覺得受用不知正是魂不散底死人落空亡底外道山僧又向你道不得無心死坐不得離話頭空坐有不得無不得亦有亦無也不得非有非無也不得離四句絶百非到這裏正好向竹篦子觸背不得乾矢橛意旨如何發大勇猛參將去自然真疑現前不想諸兄到這裏無下手處沒滋味處反打轉來復與昏沉散亂攪作一團如此用心莫説在龍山會裏便是釋迦復出達摩再來也救你不得嗚呼近來人心不古聖教衰微今有一般長老自己道眼不明統一群瞎漢撑一個門庭見來幾個好學者安下單來不教下死心做工夫今日出幾個問頭明日出兩則公案引得十個一群五個一隊商量浩浩著成轉語做成拈頌呈上方丈瞎禿奴也不管他有見地無見地即便圈圈點點送將出來學人一見圈了拈頌點了轉語通身慶快便道和尚肯了我終日向本子上去念機鋒學公案將古人言句盡作是非得失商量若人問著如打熱病相似胡説亂道如不肯他滿肚無明便道某和尚肯過我底裝模作樣輕慢聖賢空腹高心造地獄業此正是打頭不遇作家到老終成骨董所以參玄上士先要具一副擇法眼親近一個明眼長老可以與你抽釘拔楔解黏去縛諸兄弟若要解黏去縛麼將諸方學得底心意識邊想得底册子上看得底盡情放下放到無可放處死到無可死處向這裏正好看一個公案或是竹篦子或是乾矢橛如靠一座須彌山相似向四威儀中時刻不可放過直待懸崖撒手如夢醒如蓮花開噫此回更不疑天下老和尚舌頭也到恁麼地正好向師承邊十年二十年溫研積稔將五家剛宗細大法門古今言句千七百則葛藤一拍粉碎方可向水邊林下峭壁峰前保養聖胎諸昆仲即今還有與麼人也無設有一任你橫擔拄杖緊峭草鞋若無不若按下雲頭向龍山頂上種田博飯喫良久卓拄杖下座示衆昨日把定封疆今朝放開一線沸湯鍋裏冰凌石火光中掣電若能於此會得許伊工夫成片設若於此不會未免墮坑落塹墮坑落塹即且置衆中還有工夫成片者麼有則不妨出來竹篦子與你相見問如何是句師豎起竹篦曰如何是意師放下竹篦曰如何是意句交馳師和聲便打僧無語師曰不得有語不得無語向這裏道一句看曰舌頭不出口師曰這是有語僧佇思師曰這是無語僧禮拜師曰又是躲根問乾矢橛意旨如何師曰石羊吞石虎舉僧問雲門如何是佛門曰乾矢橛若恁麼會許伊開一隻眼如何是佛乾矢橛若恁麼會未免瞎一隻眼若要雙眼圓明直待彌勒下生且道彌勒幾時下生待虛空落地時向伊道示衆一念迷處是衆生一念覺時原是佛直下迷覺兩俱空佛與衆生是何物縱然會得諦當猶是高郵到邵伯乃彈指一下曰若恁麼會去省卻多少力夢覺偈示衆夢裏事事分明覺後空空如也一靈真性非真四大假合非假夢覺真假雙忘步步頭頭脫灑語默動靜之中一任呼驢喚馬示衆説宗説教也是弄精魂説禪説道也是弄精魂説心説性也是弄精魂説凡説聖也是弄精魂揚眉瞬目也是弄精魂入定凝神也是弄精魂朝參暮請也是弄精魂擦褲摩褌也是弄精魂精通三教博盡古今也是弄精魂直饒你將三藏十二部一切修多羅念在肚皮裏如瓶瀉水也是弄精魂三世諸佛歷代祖師天下老和尚拈椎豎拂接物利生説玄説妙提古拈今也是弄精魂將一千七百陳葛藤橫説豎説縱橫十字説攪長河為酥酪變大地作黃金也是弄精魂於中若有旁不甘者出來道龍山恁麼説話莫不別有長處麼山僧向他道並無長處只知飢要喫飯倦要睡覺痛便叫癢便笑衆中若有人道龍山恁麼説話也是弄精魂山僧只得呵呵大笑且道笑個甚麼寧可與有智人相罵不可與無智人説話便歸方丈記録隨後入方丈作禮師曰你見個甚麼道理便來禮拜曰見和尚弄精魂師曰你因甚隨山僧腳跟轉曰理長則就師笑曰弄精魂漢又一僧上方丈呈見解師曰直饒你千了百當拈來便用事事無礙也是弄精魂其僧罔措而退示衆龍山昔年曾向江南行腳參一則極現成底公案懷藏至今未嘗舉似與人適因諸兄發向上心結精進七山僧今日不惜眉毛得得舉似敢保個個悟去正欲説時被諸兄一拜拜得我忘前失後又被諸兄問甚麻三斤乾矢橛竹篦子父母未生前問得我口啞無言轉身吐氣不得將此一則公案忘卻了也儘力思量要覓一個元字腳也了不可得驀豎拄杖曰拄杖子你還記得麼試代我道看良久曰拄杖默而不答兩個有頭無尾漢好與一坑埋卻低頭歸方丈示衆人生中國易要求出家難捨俗出家易參禪學道難參禪學道易親近知識難親近知識易望長久遠難望長久遠易捨己從人難捨己從人易通身放下難通身放下易千了百當難千了百當易事事仍舊難饒你千了百當事事仍舊若論佛法大意更向三條椽下七尺單前參三十年來喫龍山拄杖何謂如是不見道一絲不透如隔鐵圍冬前示衆明日交冬數九凍得石女縮手灌了熱酒三杯喫得通身是口崖前罵雨呼風山頭倒翻斤斗過了一百單五大地山河露醜諸昆仲還會麼若不會更聽龍山重説伽陀千花萬花等春來獨有寒梅向雪開此花何故能開早披霜帶雪舞三台新節示衆昨日放開一線一任説黃道黑今朝把定對疆直教水泄不通若道放開一線的是此人理上偏枯若道把定封疆的是此人事上偏枯若道是則總是非則總非未免儱侗真如顢頇佛性若向這裏道得十成句子任你東行西行若道不得且向長連床上交腳坐朔旦早課竟示衆乃顧左右召大衆曰好個西來大意適被諸兄異口同音花劈了也一場狼藉且道是有是無若道是有有眼不能見若道是無怎奈七花八裂東撇西拋諸兄弟若向這裏薦得一任腰包散去何必聚首作堆若於此不會今逢朔旦良辰不得開眼説夢便歸方丈示衆龍山有時著珍御服向諸人面前立地諸人又不識好龍山有時著敝垢衣向諸人面前立地諸人又不識歹龍山有時赤條條向諸人面前立地諸人又不敢正眼覷著於中若有個衲僧出來道目前無闍黎此間無老僧又作麼生龍山只向他道昨日西風起今朝刮地霜除夕普茶示衆諸兄還聞爆竹聲麼此聲是一顆如意寶珠盡大地若有一人得者敢保福足慧足隨心應用無虧可以登寶華王座應水月機向一毛端現寶王剎坐微塵裏轉大法輪逢時應節臘盡春回鷲嶺拈花消息盡被萬象森羅一時漏泄了也諸兄設若不會與你畫蛇添足喝一喝曰大家喫茶去開新鐘板示衆乃拈椎曰權衡佛祖成聖轉凡號令人天騎聲蓋色且聲不是聲色不是色現前諸兄切忌向那邊覓不向那邊覓時如何遂擊鐘板各一下曰若將耳聽終難會眼處聞聲始得知開大鐘示衆曰鯨音一吼山河曉驚醒夢中多少人設有灰心聾兩耳野老拈花萬國春便撞一下開新雲板示衆師拈椎曰昔金牛和尚每作飯熟時自舁飯桶至食堂撫掌呵呵大笑曰菩薩子喫飯來美則美矣善則未善不合引得無限人敲磚打瓦作佛法論量可謂錯用其心龍山即不然若遇齋時又作麼生遂擊板三下曰和尚子過堂去
