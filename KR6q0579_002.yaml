body:
  text: 繼住龍山華嚴院嗣法門人行悟等編次住汾州府孝義縣龍山華嚴禪院上堂前住僧率眾善信請入院師至座前曰這箇寶華王座三世諸佛從此說法歷代祖師從此利生且道新龍山到這裏又如何施展拱拂子便陞座拈香祝聖畢復拈香曰此一瓣香無聲無臭無黨無偏第三回拈出耑為供養現住江南常州府宜興縣敕建靈山衍慶堂上第二代傳曹洞正宗竹浪本師和尚用酬法乳書記白椎曰法筵龍象眾當觀第一義師揮拂子曰好箇第一義卻被書記一椎擊碎了也作是觀者名為正觀若他觀者名為邪觀邪正已分請出道看書記問巍巍寶座炫碧天萬瑞千祥遶法筵第一義諦即不問三玄三要請師宣如何是第一玄師曰無舌童子口喃喃如何是第二玄師曰石女崖前笑如何是第三玄師曰你還會麼如何是第一要師曰饑來喫飯如何是第二要師曰倦來打眠如何是第三要師曰喜便笑怒便鬧秖如一句具三玄一玄具三要此意如何師曰風來水面起波瀾記曰恁麼則獅子便解翻身去不縱橫處也縱橫師曰一任𨁝跳乃曰古德道未得個入頭處求個入頭處已得個入頭處求個出頭處且道如何是入頭處大慧杲曰如何是佛乾矢橛這一句子疑破恒河沙數疑一時破矣諸昆仲佛法不是草草所以古人道個句道個意又道句中意意中句句中無意意在句中句能鏟意意能鏟句意句交馳是為可畏正是一句當天八萬生死門永絕直饒你將這一句徹底掀翻千了百當說得行得把得定作得主到這裏還算得入頭處也未雖深得入頭處便喚作入頭處正是法見未亡不見文殊才起佛見法見被如來貶向二鐵圍山任你蕩盡諸見大法已明攪長河為酥酪變大地作黃金竿木隨身逢場作戲若到新龍山這裏向你道未在且道過在甚麼處咄有佛處不得住無佛處急走過三家村裏王大姐是甚麼熱大書記結椎曰諦觀法王法法王法如是下座破上上堂師曰一二三四五金木水火土泥細好燒磚何必問張魯既不問張魯且僧堂作麼生建乃豎拂子曰大眾看看一毛頭上現乾坤萬象森羅齊下手下座便穵土三下康熙癸丑四月八日禪堂落成兩序請上堂問賢於長者插標竟一殿巋然迥碧空釋梵雨花香撲鼻經行坐臥於其中請問和尚如何是其中事師曰左之右之曰可謂道也者不可須臾離也可離非道也師曰滿眼滿耳曰今日學人小出大遇也師曰鄭州出曹門問如何是清淨法身師曰屎窖裏蝦蟆曰如何是圓滿報身師曰癩豬臥泥坑曰如何是千百億化身師曰東村王大姐曰如何是直指之道師曰腳跟下好與三十棒曰若行此棒不虛受人天供養師曰不是山僧卻被上座惑亂一上問如何是正中偏師曰杲日麗中天如何是偏中正師曰盲人照古鏡如何是正中來師曰蓮花火裏開如何是兼中至師曰鐵犬庭前吠如何是兼中到師曰木人撫掌笑曰正位即空位此說還端的也無師曰切莫道聽途說問未離兜率已降王宮未出母胎度人已畢且道說個什麼師曰葛藤花結金剛子曰三十二相即不問如何是金剛不壞身師曰爛枯樁問秖如道人人本有個個不無不無是個什麼師曰朝朝同起夜夜共眠曰恁麼則是一靈真性也師打曰莫認驢鞍橋為阿爺下頷劉居士問綠漸稠兮紅漸稀江南處處子規啼百花開放無言說時聽獅王轉大機大機一句即不問世尊出世請師提師曰速禮三拜士曰人天百萬齊瞻仰法席宏開眼界新師曰全賴居士證明乃曰一毛頭上現寶王剎坐微塵裏轉大法輪則易向龍山頂上建選佛場學無為法則難直饒難易兩忘猶是老婆見解未是超佛越祖之作今日龍山僧堂煥然一新光奪人目且道仗誰恩力莫是仗三世諸佛歷代祖師恩力莫是仗韋馱伽藍恩力莫是仗檀越經首工匠恩力莫是仗堂頭和尚闔院大眾恩力若道仗三世諸佛歷代祖師恩力又孤負韋馱伽藍若道仗韋馱伽藍恩力又孤負檀越經首工匠若道仗檀越經首工匠恩力又孤負堂頭和尚闔院大眾若道仗堂頭和尚闔院大眾恩力又孤負三世諸佛歷代祖師正恁麼時畢竟如何卻好道得平展一句驀豎拄杖曰還見麼拄杖子頂𩕳上肉髻中放百寶光明於一一光中現千葉寶蓮三世諸佛歷代祖師韋馱伽藍檀越經首工匠堂頭和尚闔院大眾同登千葉寶蓮結跏趺坐合掌當胸異口同音高聲唱言普請大家同慶讚一齊側耳聽法輪遂卓拄杖一下曰上來講讚良因普霑沙界秖如祝國裕民又作麼生五湖四海歸王化浩蕩乾坤萬億春下座祈晴上堂師曰久雨不晴浸爛衲僧鼻孔簷聲弗斷滴穿諸佛眼睛直得燈籠撫掌露柱微笑且道明什麼邊事若向這裏會得敢保直下雲消霧散杲日當空曬得石人汗出青天也須喫棒問昨日雨今朝晴時如何師曰石人撫掌笑呵呵僧喝師打曰好彩不得不賞僧禮拜師下座佛誕日上堂師曰世尊未出世人人鼻孔撩天出世後為甚杳無消息於此明得不妨與山僧拄杖子盤桓一上問世尊未離兜率已降皇宮未出母胎度人已畢因甚又上雪山六年苦行師曰落花臺上重鋪錦曰既是天上天下惟我獨尊又因夜睹明星悟道且道悟個甚麼師曰瑪瑙階前布赤沙曰昔日鷲嶺今朝龍山是同是別師曰兩彩一賽曰可謂三生有幸逢師話月到中天碧水寒師曰問事即得禮拜了退問佛身無為不墮諸數既不墮諸數今日生個什麼師曰莫謗世尊好曰昔日雲門道我當時若在一棒打殺餵狗貴圖天下太平秖如雲門具何眼目師曰家富小兒嬌曰和尚又作麼生師曰將此深心奉塵剎是則名為報佛恩乃豎拂子曰釋迦老子生也在山僧拂子頭上周行七步目顧四方一手指天一手指地曰天上天下惟我獨尊汝等諸人還見麼若見卻是自瞞若不見又被他瞞到這裏畢竟作麼生放下拂子曰雙雙木馬嘶風去直至如今不見蹤揮拂子下座佛成道日上堂欲知佛性意當觀時節因緣眾中還有應時及節底衲僧麼有則出眾道看問鐘侵鼓伐一齊鳴獅王登座野狐驚宗乘向上即不問五宗派旨請師明師曰一一問將來如何是曹洞宗師曰無舌人解語如何是溈仰宗師曰無毛鷂子撲天飛如何是雲門宗師曰一掌一握血如何是法眼宗師曰一棒一條痕曰五家宗旨承師荅龍山新令又如何師曰眼見耳聞曰恁麼則西來大意親薦得天外乾坤任優游師曰看腳下問如何是人中境師曰月照孤峰頂如何境中人師曰頭戴青天手攜帽如何是賓中主師曰舌頭不出口如何是主中賓師曰為憐三歲子不惜兩莖眉僧禮拜師曰為甚不問主中主僧起擬進語師便打曰已遲八刻乃豎起拂子召眾曰還見麼黃面老瞿在拂子頭上入正定三昧睹明星豁然大悟曰奇哉一切眾生具有如來智慧德相但以妄想執著而不能證得拂子忍俊不禁揚聲大叫曰諦當甚諦當敢保老兄未徹在諸昆仲且道那裏是瞿曇未徹處若能於此明得非惟親見拂子落處亦能親見黃面老子悟處方可向孤峰頂上呵佛罵祖十字街頭播土揚塵竿木隨身逢場作戲其或未然龍山不惜眉毛向諸兄下個註腳瞿曇恁麼悟去秖悟得一切眾生具有如來智慧德相若論祖師向上一著猶較遠在且道如何是向上一著良久曰叮嚀損君德無言真有功任從滄海變終不為君通下座結制日上堂師至座前乃曰這個曲彔床子三世諸佛於此錯說法歷代祖師於此錯說法今日山僧也只得將錯就錯便陞座維那白椎竟師曰言前薦得句後知歸總是觸途成滯還有不涉此病者麼出來道看問離四句絕百非請師直指西來意師便打僧喝師又打僧禮拜師直打下問佛未出世時如何師曰天下太平曰佛出世後如何師曰攪亂支那曰出與未出時如何師曰幾多歡喜幾多嗔曰知音不必頻頻舉達者須知暗裏驚如何是到家一句師曰牛頭車子推明月曰恁麼則一毛頭上全體現遍界明明不覆藏師曰山僧疑著你僧喝師曰識甚好惡問如何是事無礙師曰口念彌陀手宰鱉如何是理無礙師曰龍峰頂上浪滔天如何是理事無礙師曰十字街頭乞一文如何是事事無礙師曰肩挑滴醋賣私鹽曰人天百萬齊瞻仰大地咸叨法益恩師曰輕打老僧問馬祖陞座百丈卷席此意如何師曰車不橫推曰捲後如何師曰理無曲斷曰依然山是山水是水也師曰無山無水你又作麼生僧佇思師震威一喝僧禮拜師曰切莫忘了龍山這一喝問古祖家風從此展龍山祥瑞滿座生凡聖混融即不問堂堂獨露意如何師曰切莫錯過曰不錯過時如何師曰道道僧擬議師曰原來賺我乃曰天不非天地不非地山原是山水原是水眼見色鼻出氣耳聽聲舌知味是法住法位世間相常住若恁麼會一生參學事畢天是天地是地山是山水是水眼見色鼻出氣耳聽聲舌知味是法住法位世間相常住若恁麼會入地獄如箭射不見古德道無手人行拳無舌人解語且道無舌人說個什麼無手打個什麼雖然恁麼提持未免太煞徑截令後代兒孫鑽龜打瓦枉作佛法商量龍山則不然有手入行拳有舌人解罵罵盡天下無敵口打盡天下無敵手且道龍山恁麼說話與古人是同是別良久卓拄杖曰今日非非想天有幾人退位復卓拄杖下座解制上堂問如何是三玄師曰清風生八極曰如何是三要師曰明月照寒潭曰古人道一句明明該萬象重陽九日菊花新且道是那一句師曰我見燈明佛本光瑞如此問如何是函蓋乾坤句師曰木雞架上啼如何是截斷眾流句師曰鐵犬庭前吠如何是隨波逐浪句師曰犁星趕七撮曰可謂無古無今無背無面也師曰猶是長連床上學來底問佛說一切法為度一切心如何是心師曰須彌藏北斗曰我無一切心何用一切法如何是法師曰正月十五曰心法兩亡時如何師曰波斯讀梵書曰與麼則生不愁死不怕諸佛頭上行和尚面前罵也師曰杜撰禪和如麻似粟乃曰十五日以前萬里一條鐵十五日以後三人證龜成鱉正當十五日處處鑼鼓鬧喧天家家人事忙不徹惟有龍山拄杖子年頭月尾嘴盧都昨夜三更燈光藏菩薩現大神通眉間放一道白毫相光光中涌出百千萬億樹燈上照有頂下徹無間為甚諸兄各各腳跟下依然黑漆漆地或有出來道和尚不得壓良為賤比來拋磚引玉卻得個土塹子下座付碧源雙輸二禪子上堂座元問王子未灌頂時如何師曰生在皇家不復貴曰灌頂後如何師曰敕下傳聞名始尊曰恁麼則七珍千子隨符應四大閻浮盡荷恩師曰也要共相證明監院問如何是提婆宗師曰石女崖前唱巴歌曰如何是吹毛劍師曰光射斗牛寒曰有問有荅賓主立見無問無荅時如何師曰你若無心我便休曰恁麼那恁麼那師打曰切莫弄巧成拙問文殊是七佛之師為甚出女子定不得師曰荷葉團團團似鏡曰罔明菩薩為甚出得師曰菱角尖尖尖似錐曰大了當底人如何行履師曰愛嗔不愛喜僧無瑕問承師有言截斷是非向是非薦取且道是作麼生截師曰無瑕曰非作麼生斷師曰無瑕曰是非兩亡人境俱奪又如何師曰無瑕無瑕曰竹密不妨流水過山高豈礙白雲飛師曰事則如是理作麼生僧禮拜師曰莫向這裏躲棍問世尊拈花全體露迦葉微笑事如何師曰利動人心曰若不同床睡焉知被底穿師曰知心能幾人曰今日和尚也是特地一場愁師曰祖禰不了殃及兒孫居士問佛未出世時如何師曰禮拜著士曰佛出世後如何師曰禮拜著士曰和尚恁麼荅話大有人不肯師曰山僧從不孤負人士禮拜師不顧乃拈起袈裟角曰西天四七東土二三俱從這一脈流將去繩其祖武嫡派相傳說甚分肉分皮得骨得髓止要沿流不止真照無邊然則正法眼藏向瞎驢邊滅卻諸兄弟還識渠面目麼喝一喝曰面目現在舉藥山一日謂雲巖曰與我喚沙彌來巖曰喚他作麼山曰我有個折腳鐺子要伊與我提上挈下巖曰與麼則與和尚同出一隻手去也師曰龍山今日與我喚首座監院來八道和尚喚他作麼山僧向他道我有柄龜毛拂子與伊橫拈倒用若有人道與麼則與和尚同出一隻手去也山僧向他道卻被闍黎道著更問與後如何向道藏身處沒蹤跡沒蹤跡處莫藏身遂擲下拂子曰新出紅爐金彈子簉破闍黎鐵面門上堂問古人道須參活句莫參死句如何是活句師曰剎竿頭上風車子曰如何是死句師曰斷頭船子下揚州曰且道活句死句是同是別師曰粉粧鷺鷥墨染烏鴉曰如何是向上事師曰向下薦取問師登寶座大眾臨筵西來大意請師直指師曰九曲黃河灣裏樹曰謝師荅話師曰夢裏惺惺乃曰須參活句莫參死句活句下薦得北斗裏藏身死句下知歸鬧市裏獨立秖於剎竿頭上風車子斷頭船子下揚州是活句是死句諸仁者直饒會得倜儻分明未是衲僧分上事如何是衲僧分上事拈拄杖曰飽食閒曳杖枕石聽流泉師躬至南京請藏經回山上堂問世尊四十九年說法未曾說行一字秖如這一大藏教又從何處得來曰止止不須說我法玅難思曰三轉法輪於大千其輪本來常清淨師曰今日卻被上座染污僧喝師打曰再犯不容乃曰三轉鹿菀九會鷲峰打開布袋傾出殘羹餿飯揭起瓶頭總輯狂言囈語從此葛藤奕奕繁衍閻浮山僧未去金陵行行文彩已彰請至華嚴卷卷黑豆生芽不惟揩瘡拭案亦圖遮眼枕眠可笑懶融講經地震秖好支吾閒漢傅大士陞座揮尺漫須遮掩梁皇秖如世尊四十九年說法未曾說著一字且道這一大藏教又從何處得來喝一喝曰止止不須說我法玅難思太谷縣貫家堡克承吳居士延僧閱藏圓滿請上堂世尊不說說懸河倒瀉於靈鷲迦葉不聞聞雨花遍散於維國心源湛寂性海汪洋不溢不流掀天揭地離相離名輝今耀古林敲竹戛恒演圓音鵲噪鴉鳴常宣法語是以剖一塵則三藏十二一切契經忽然頓現舉一物則五時八教半滿科文無不全該行布圓融理事無礙直饒恁麼猶是門庭建立邊事若據衲僧門下正好未在詎知迦文四十九年三百餘會未常說著一字達摩西來九年面壁歷代諸祖何曾道著一句然雖如是依經一字三世佛冤離經一字一問魔說克承居士請諸兄轉藏還曾轉著一字麼今晨延山僧陞座何曾說著一句轉說且止如何是功圓果滿一句拈拄杖卓一下曰懷州牛喫禾益州馬腹脹舉昔有一婆子令人送錢請趙州轉藏州受施利了卻下禪床轉一匝州曰傳語婆轉藏已竟其人回舉似婆婆曰比來請轉全藏如何秖為轉半藏徑山杲曰眾中商量道再遶一匝或彈指一下或咳嗽一聲或喝一喝或拍一拍恁麼見解只是不識羞若是那半藏莫道趙州更繞一匝直饒百千萬億匝於婆子分上只得半藏設使更繞須彌山百千萬億匝於婆子分上只得半藏假饒天下老和尚共如是繞百千萬億匝於婆子分上也只得半藏設使山河大地森羅萬象若草若木各具廣長舌相異口同音從今日轉到盡未來際於婆子分上亦只得半藏諸人要識婆子麼良久曰鴛鴦繡出從君看不把金針度與人師曰徑山老人與麼提持也是齪奔彩家扶強不扶弱諸人要識克承居士全藏麼以拂子擊按曰向這裏會取下座因事上堂舉翠巖真點胸常罵雲居舜說無事禪石霜永和尚令人傳語曰舜在洞山悟古鏡因緣豈是說無事禪你罵他自失一隻眼舜聞之作頌曰雲居不會禪洗腳上床眠東瓜直儱侗瓠子曲彎彎永亦頌曰石霜不會禪洗腳上床眠枕子撲落地打破常住磚師曰雲居無事猶可原翠巖佛事卻難恕合喫三十棒惜乎多嘴阿師說破至今此案未圓龍山今日圓此案也乃曰龍山不會禪山居愛種田钁頭常在手匾擔不離肩夜來賊打門前過天明失卻刈茅鐮下座藏經閣上梁兼閱藏開經上堂驀豎拂子曰諸人還知各各當人頂上有一寶王經閣萬古光徹九天非惟無位真人於中出入常有大千經卷於中展演乃至盡未來際亦無已時諸人還聞麼賢於長者建剎已竟麼轉大法輪麼三世諸佛出來呵呵大笑曰且喜柱豎耶梁昇耶那一柱不具丈六金身那一梁不具衲僧手眼山僧道住住今日事忙待閒時與你理葛藤卓拄杖曰上梁功德殊勝行無邊勝福皆回向下座藏經閣毘盧佛開光上堂遮那無上尊三界莫能及天人之導師四生之慈父應跡於龍峰千葉蓮花座直饒眼光爍破四天下到這裏還須點過何以如此不見昔日石頭問長髭大庾嶺頭一鋪功德成就也未髭曰成就久已秖欠點眼在石頭曰莫要點眼麼髭曰便請石頭垂下一足龍山今日問僧藏經閣內一鋪功德成就也未僧曰成就久已秖欠點眼師曰恁麼與伊點眼去也僧曰便請師垂下拄杖曰石頭點眼眼在足下龍山點眼眼在棒頭兩段不同今古齊收下座克承吳居士為尊慈誕辰請上堂拈拂子作此相曰會麼於此會得在天則清在地則寧在君則聖在臣則忠在父母則慈在子孫則孝在衲僧分上又作麼生陣雲橫海上拔劍攪龍門記得世尊在靈山會上說法華經有龍女獻一寶珠佛即受之龍女謂舍利弗言如我獻珠世尊納受是事疾否荅言甚疾舍利弗及眾會皆見龍女變作男子疾往南方無垢世界現十八變成等正覺今日吳母李太夫人不移此界還以本身不現神變成等正覺淨佛國土成就眾生諸人還信得及麼若信得及大家捧缽齊下食堂擾克承居士齋下座上堂舉雲門露字曰只這一露字盡大地人僉作佛法奇特商量雲門雖然四稜著地猶欠頂門正眼當時龍山若在見他與麼道劈面便掌待他惡發徐徐向前拱手道莫怪適來觸忤直饒雲門氣吞宇宙眼蓋乾坤管教冰消瓦解下座上堂諸佛未出世石壓筍斜出達磨未西來懸崖花倒生佛法遍天下天晴日頭出談玄口不開雨落地下濕口既不開玄作麼生談若於此了然不妨歸家穩坐其或未然龍山不惜眉毛向諸人道破喚作竹篦即觸不喚竹篦即背便下座
