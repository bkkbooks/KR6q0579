front:
  text: 柏山楷禪師重編語録序柏山楷禪師語録序如來説法廣大精微悉具平實六祖已還單刀匹馬直度劍關大憝既翦始布腹心吾汾陶唐故地洙泗遺澤世遠人亡經殘教弛危微宗旨克復法門荒蕪閉塞柏道人隻履南來卓錫龍麓鄙豫不佞嘗與升堂邂逅入室盤桓吾儒大義腳根地步視老宿經師反較跖實乃知悟有真悟證有真證焉可誣也癸亥秋冬之交豫自朔方旋里道人延致方丈同榻者纍月時聞領略私幸口業不墮地眼光可存人間大要威儀肅而不繁督責嚴而不苛本西來不立語言文字大意務使前後際斷動靜不生讀其語録率截路賊斬草除根手眼乃知學有真學獨是平易近人無身分見並無無身分見與録中開示及接膝論議又何平實也方外弟胡廷頓首謹書柏山楷禪師語録序夫靈鋒出匣魔佛潛蹤寶鏡臨臺媸妍互現辨龍蛇於棒下驗凡聖於機先牙如劍樹口似血盆妙用無窮神機莫測吾侄楷公禪師得之矣古云見與師齊減師半德見過與師方堪傳授公嗣法覺華竹和尚去洞山三十一世乃靈山石鼓老人嫡孫辨嶽瑞祖之玄孫也説法西晉聲振寰區衲子雲臻檀那欽服蓋行藏高古道眼圓明之所然也老僧因讀是録不忍釋手謂侍僧曰後五百世有緣衆生遇此録者不斷八苦不證無上菩提者無有是處侍僧禮拜記之為序云住荊溪國山善權寺法叔智傳撰汾陽龍山華嚴堂上傳曹洞正宗第三十一世柏山楷禪師行實金陵城西圓通通睿頓首述師諱德楷字柏山維揚泰興莊氏子父字承智母馬氏世奉三寶一乳十八人師居其殿在襁褓中見佛像便知合掌聞酒氣及鮮味即噦喜趺坐愛聆念佛聲識者驗其為夙昔之善習也有風鑑熟視曰此子乃山林氣象非世俗丰儀甫九齡而兄姊子侄皆相繼去世至十一歲復遭父變家業蕭然門庭寥落出塵之志旋萌無如母老且力經營以圖溫飽不失奉養之誠資斧之餘不吝施與全無婚娶之念而母密為擇婚逼令完娶然好道日殷不覺誤入旁門輒為領袖久之無得幡然改曰此非入道正門豈可自以為是適值上元佳節入城觀燈見覺華庵禪期報紙默自喜曰此地有禪門修行無錯路矣遂懷香入覺華謁竹浪和尚浪曰居士何來來此何事師曰本縣東鄉人聞上剎大啓禪門廣收多士以故特來求教但不知在俗人亦可參禪否浪笑曰你在家可喫飯麼師曰喫飯浪曰既能喫飯便可參禪師禮謝而去屆期束裝徑往浪見其慕道甚愨即命司賓引入禪堂晚詣方丈求一話頭浪曰汝慕道既久豈無一個話頭以為指南麼師便以生從何來死從何去相告浪曰即此話頭可參師回堂從旦至暮沒頭沒腦悶悶昏昏如居暗室但念話頭不知用工話頭才舉妄想又生妄想乍歇昏沉旋來昏沉稍蘇即墮於無記窟裏似有似無猶水浸石了無疑情若是者三日適浪下堂考諸工夫開示所參須善用工第一不得向心意識上卜度務要大死一番方能與此事相應師聞之不覺疑情頓發二六時中不知有身心世界惟是話頭卓立面前咬嚼不破至第八日開靜後詣西堂寮請益才見便閉門師端立少頃適值行者入門師亦拶入堂喝曰夜靜更深來作甚麼師曰請問佛法堂道若論佛法於未入門時早已向居士道過了也師曰正入門時請師一接堂曰猶是門外漢便推出回堂力究轉覺水盡山窮銅牆鐵壁至十日浪又下堂師出作禮浪則劈脊便棒才起擬開口又攔胸托倒一似有氣死人西堂拽師椅上汗流如雨工夫自此成片要覓個昏沉妄想了不可得秖有一個疑團現前雖拈箸執碗亦不知我有手足西堂以杖觸胸恍若夢醒悲欣交集始知此事不從人得本自現成明明歷歷未嘗覆藏有偈呈方丈曠劫無明當下歇甕裏何曾走卻鱉若更問我意如何大冶紅爐飛片雪聲未絶浪曰你參什麼話頭師展兩手浪曰生從何來死從何去師曰周橋河底水日日向西流浪曰你見個什麼道理敢開斯口師曰弟子終不敢向好肉上剜瘡浪曰猶欠腦後一鎚在如此往來覺華工夫日進細思老母生養死葬子道頗完今幸獲線明尚未大暢不乘此時掙出火宅更何待焉即棄家室乞浪剃染是年三十有二冬過邗江天寧受具足戒期畢回覺華請假參方不允命董院事未幾值百愚老人住持善權遣師走賀呈書畢侍立愚問禪師是覺華法屬耶學人耶師以實告愚謂即今書已達矣如何是你底師曰昨日渡江今見和尚愚曰江深多少師曰只見移舟到岸不知江水淺深愚顧左右曰且道此僧有見地無見地師曰老和尚疑此當更買草鞋行腳始得愚謂念汝途中辛苦且記三十棒師曰與麼則禮拜老和尚去也回至本邑孫橋猛省參方要事急宜再進竿頭倘惟命是聽豈不誤此歲月即將回書轉煩友人達之覺華由是遍歷名山廣參宗匠所到無不印可具稱敏捷師笑而自審若西來之旨苟止如此則祖道安能垂統萬世無弊吾今於五家宗旨若不能一一透過誓不參禪一經一咒以了此生也道經毗陵孟瀆弛擔嘉山聞雲水數僧言此山角落有個彬隱禪師見地超卓行履端方係親覲祖讓和尚也師驚喜向晚謁之覿面機鋒迅發師不能敵師曰適來機語是兄平日意識強記所到非衲僧本分生涯消不得一場熱病淨盡捐祛將什麼回復閻羅鐵面此皆近日禪人通病不獨兄然也疊舉公案數則勘驗淆訛師亦強與支吾彬笑曰半塗暫止之歡非穩坐家堂之樂也倘自以為是則理事不通未免一派杜撰日後賺誤來學不淺其間有清剖傑峰二師時為自謙和尚首職彬語傑剖曰雲水中有一禪者頗英邁惜死而未活不諳言句在剖傑驚異即邀師促膝劇談傑稱大奇難得老兄到此地位但厥症與弟相符耳遂訂生死交必宜互相策進至於千了百當而止傑乃剖徒也曾歷諸方飽餐五味具相受記獨彬不肯然二公亦不自欺剖隨拉師結七彬監香七完而二公之礙膺者頓釋師則依然如初彬即引見靈隱具祖祖問那裏來師曰維揚具曰曾到天寧麼師曰曾受天寧具足具曰畢竟喚什麼作戒師曰只聞白四羯磨不知喚什麼作戒具以實須人難得姑送梵香閣時豁老人初受顯寧請具白衆為覓輔佐師願隨往住無何因沙汰事旋同彬回般若彬染疾篤師曰倘兄不起德楷更倚誰以了此大事彬曰不難今有金陵靈谷千南和尚第一座字塵仙者係南屏小獅子法眼圓明應機無礙五花宗旨透徹底源汝可相依必能了事言訖坐逝復有好道緇素更祈剖公結七而豫適自千華回師相邀入七期至五日正經行時有僧問麻三斤意旨師曰石女駕鐵舟浪裏揚風帆豫聞而頓悟涅槃心要實賴師之提攜也期畢師與傑公相約上鍾山而于祖已順世矣塵仙和尚以比肩而為後嗣繼席靈谷古哲之忘人我為法門一至於是塵和尚一見謂獅子遊行不偕伴侶因什二人同行聻師便喝塵曰喝則不無爭教無舌人解語師又喝塵曰機不離位墮在毒海水單缺職姑令暫補師如命私謂傑曰彬公之言徵矣一日塵至寮見案頭頌古問是誰作師曰和尚見什麼塵叱瞎漢猶作這般見解師喝塵掌之師作禮塵復拈頌本謂這個且作麼生師擬對塵便掌曰胸中大有物在次日遷內司賓每夕必候至更深參請諸案淆訛塵曰且置是事只如有句無句如藤倚樹樹倒藤枯句歸何處作麼生會師直言德楷於是乎有疑塵謂於此有疑則一切公案都無著落後凡遇師即以此拶問師才啓口塵便搖首叱之不是不是師疑甚切一日晚參舉五祖描不成畫不就相隨來也等語乃曰靈谷則不然有問有無藤樹之旨則向他道不因紫陌花開早爭得黃鸝下柳條如進問藤枯句歸之旨便向他道昨日磚肚裏痛三更産下白頭翁師聞之當下釋然始感彬公相薦得宜之誼嗣後問及諸案勢似破竹酬答無間叢林稱為鐵嘴塵喜曰方知我不欺汝一日侍立復問玄要綱宗作麼參究塵厲聲叱之你這個黃楊木倒縮去了以杖趁之師愈駭然疑情萬仞因過堂見飯杓落地兩跳忽大悟玄要之旨輒自笑詠偷心死盡眼麻迷石女夢中毛卓豎信乎洪覺老人恁麼道也趨白方丈塵曰比來豪傑堂頭亦不能徹見至此況庸輩乎汝今既知此要須加護念後為宗匠可與人抽釘拔楔去也執事三載辭歸覺華省落髮師師見如獲大寶喜而不寐隨命職西堂撾鼓升座拈拂子曰向這裏道一句看師曰被和尚一問直得口挂壁上浪曰且喜洞上一枝佛法流通去也遂付以源流衣拂擬擇日延師繼席師則拽杖便行上五臺過都門途遇山右李居士接談甚契結伴同禮文殊再朝普賢道經古并禮體昭二師寶塔寄錫圓覺緇素固留結冬明春又請住靜鳩修殿建參堂經三載餘悅心上人請住普通結制期畢説法下座偕二三子翛然而去所餘錢穀概不問及由是道風日盛汾人敬服共稱古佛至古中陽龍山之華嚴愛其山水幽邃志欲終身焉舊住接見欣然如故乃請重興告諸檀那削牘敦請願交此山為十方禪院一載之間衲子鱗集募修禪堂劉公修東院魏公建閣請藏一時堂搆煥新不減祇園之盛突有逃廝變服混衆乞食鄰村公丁捕獲郡牧欲罪地方師即挺身獨任郡伯怒責非輕師則恬不為意未幾郡伯褫職此事遂消村衆執香禮謝師堅拒不受無為子曰生者人之所貴死者人之所畏恥者人之所避而師不貴其貴不畏其畏不避其避此其如是我不知其真偽請質之於天地有文章輩相質理學師示曰三教名殊而理一述之者析一為三悟之者會三即一倘各高所尚議論風生其於理學愈支離矣汾陽士庶咸服其高論師適楚訪梁公途遇負蛙數筐市之為説三皈法衆蛙闃然止鬧仰聽法音其感悟物性如此靈驗雖開法山右而心不忘江南故三過靈谷掃塔慟哭謂衆曰我德楷雖承嗣洞宗而實不忘靈谷凡應機接物概行塵老人之作略所以報斯恩於萬一耳今之忘本負恩之輩聞斯言而愧死無地矣曾託豫以語録送嘉興一夕之言十霜駒隙訃音至圓通豫隨説小參中曰毅然憤悱一番大死於覺華徹底掀翻斷盡命根於靈谷宛然師之小像也師享年七十有四僧臘四十有二塔於本山之右天性剛直不耐繁文不事緣飾清儉自得雖三坐道場萬指回繞絶無一牘干及檀門亦無一物不公於衆故山右有鐵面之名叢林有鐵嘴之號告寂之日飲食如常開示無倦不襲辭衆説偈之套但坦然入室跏趺兩序急入請問遂泊然瞑目矣供奉三日顏色如生時康熙壬午三月草二日也是夜怪風大雪猿鳥哀鳴林木慘淡緇素不勝悲惋之至柏山楷禪師行實終
