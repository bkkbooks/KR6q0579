如木石時與道相去幾何師曰湖之南潭之北曰畢竟喚甚麼作禪道佛法師曰爛木頭曰一切總不得請和尚直指師以手搔頭曰髮長雖省帽風屑癢難熬僧禮拜師曰會麼曰不會師曰不會更親切問如何是父母未生前意旨師曰石女拭琴月下彈問粗言及細語皆歸第一義如何是第一義師曰粗鹽顆顆大細雨點點微曰學人問第一義師曰彭祖年高八百歲師下堂值衆經行次以竹篦約曰住住衆乃住師曰為甚達磨入你眼睛釋迦鑽你鼻孔你知麼一衆無語師曰若到諸方不得道龍山拖泥帶水為人好拽竹篦歸方丈問心生則種種法生且道心從何處生師曰魚行水濁曰心滅則種種法滅且道此心滅向何處去師曰鳥飛毛落曰秖如心未生時是何境界師曰馬蹄囫圇牛蹄破曰畢竟喚甚麼作心師曰終不敢頭上安頭問如何是陰陽主師曰管筆能書片舌能語問南泉斬貓意旨如何師曰風行草偃曰既為大善知識因何殺心不除師曰非公境界一日祥瑞禪人舉憨山大師住獅子庵時因送朱太史至三門見犬繩繫踞地太史指犬謂大師曰為甚金毛獅子變作狗大師曰秖為多開口師曰我當時若在不恁麼道梁居士曰請和尚道看師曰雖然是狗善能咬人梁拊掌稱善問如何是本來面目師曰土塊好打刀曰念佛底是誰師曰一雙不是兩個一日師聞爆竹聲曰好個西來意可惜無人會一僧曰少賣弄師曰蒼天中更加冤苦問如何是句師曰風吹雨灑曰如何是意師曰日曬火燒曰如何是句到意不到師曰水淹螃蟹曰如何是意句俱到師曰日出家家曉曰如何是意句俱不到師曰朽木蓋華堂問無夢無想正睡著時主人公在甚麼處師震威一喝僧罔措師打曰開眼說夢漢問如何是佛師曰西風過耳如刀割曰不會師曰來朝定有霜如雪問文殊是七佛之師為甚出女子定不得師曰窮不捨命曰罔明菩薩為甚出得師曰富不捨財一日師下堂值衆經行次乃以竹篦約曰住住衆齊住師曰山僧欲與諸人道一句子又恐畫蛇添足遂擲下竹篦便出堂師過汾陽遊甘露泉問住持乞水嘗住持曰此水苦喫不得師曰既是甘露泉為甚反苦住持無語問百尺竿頭如何進步師曰剎竿頭上煎䭔子曰進後如何師擒住曰道道僧擬議師托開曰原來賺我問離心意識作麼生參師曰蘇嚧蘇嚧㗭唎㗭唎曰不會師曰大悲咒也不會便打問如何是父母未生前本來面目師曰不萌枝結無花果次日僧問曰昨蒙和尚答某甲語曰不萌枝結無花果此意如何師曰昨日無此語莫謗山僧好一僧呈麻三斤頌師不肯僧請師頌乃曰問在答處答在問處并産完公大憑大據且道喚甚麼作大憑據恐後無憑以此存照中斗梁居士屢至山問道師特過榆楊奉謁士因呈數十年用心之苦方有所得師曰且將居士從前所見所得盡情拈向一邊秖如睡醒還得一如否士愕然曰和尚正爬著我底癢處到這裏卻去不得師曰睡醒既不得一如生死又焉得一如生死既不得一如至如逆順境緣到來自然被他轉換不得自由自在也向來於心意識邊暫時所得底於生死頭邊還用得著麼士曰自今而後為門下弟子終不敢自欺自瞞也梁居士臨辭相約師回南之楚士固留山庵過夏每日與師論從上公案師曰未在士曰我所見者於本分中並沒有甚麼奇特秖是一味平常為甚和尚不肯我者何也師曰汝但無事紛擾心中甚平怗才有事來便不平怗也凡有一則淆訛公案到汝面前使去不得也有說得著底也有說不著底安得謂之無事謂之平怗者乎乃以無夢無想話深錐痛拶士說道理師曰秖如牛過窗櫺貓兒捉老鼠試下語看皆不契士從此大起疑情念念不去寢食俱忘一日與師言及大隨以履覆龜話大段大隨作怪換人眼珠乞師頌師隨述曰天下衆生皮包骨此個烏龜骨裹皮老婆原是女人做說與禪人更莫疑士恍然謂師曰無夢無想無見無聞正睡著時原來是這個道理至於正睡著時主人公在甚麼處安身立命弟子到這裏卻過去不得無處下手師曰汝到這裏過去不得無下手時是何道理士擬議師震威一喝便歸方丈士當下有省即呈偈曰一喝分明拂袖歸無心用處早成非欲知個裏真消息石女生兒木馬嘶師閲偈笑曰山僧今日為汝助喜乃設六問驗之士曰面目雖殊其旨則一從今更不疑天下老和尚舌頭也師述偈贊曰善哉梁公離情絶見三十年來打成一片絶後再蘇冷灰發焰一念萬年萬年一念咦橄欖葉放夜叉頭芍藥花開菩薩面問文殊七佛之師為甚出女子定不得師曰東瓜直儱侗曰罔明菩薩因甚出得師曰瓠子曲彎彎問喚作竹篦則觸時如何師曰左眼八兩曰不喚作竹篦則背時如何師曰右眼半斤曰不得有語時如何師曰三斤四十八兩曰不得無語時如何師曰九九八十一僧擬進語師直打退問麻三斤意旨如何師曰八角磨盤空裏走僧作禮師曰會得禮拜不會禮拜僧擬議師曰將謂我孤負汝卻是汝孤負我便打問承師有言離心意識參絶凡聖路學秖如心意識凡聖二路作麼生離師曰金香爐下鐵崑崙問不是心不是佛不是物語未竟師曰住住秖消念到這裏僧擬議師打曰拋卻甜桃子沿山摘醋梨師隨衆喫放參竟師喚僧來僧出侍立師即吹滅一燈僧曰此意如何師曰莫向那邊會僧曰欲向那邊會時如何師打曰不快漆桶問澄潭月朗為甚麼不徹底掀翻師曰你試掀翻看僧便喝師作此相僧擬議師曰莫妄想一僧才出師進前曰三個孩兒打花鼓好大哥休來攔我毬門路僧擬議師便打一僧字如蘭問如何是學人本來面目師曰荊棘遠無刺芝蘭近有香問無夢無想無見無聞主人公在甚麼處師曰枕子撲落地打破常住磚僧作禮起曰某甲不會師打曰瞌睡猶未醒在師下堂茶罷乃喚行茶僧僧近前師覆卻茶鐘僧禮拜師曰不得作佛法會你作麼生會僧忙然師曰卻是山僧罪過師因病次偶出方丈遇一老宿宿曰和尚安否師曰安宿曰和尚不要動煩惱常要歡喜貴恙就好了師曰我也不歡喜也不煩惱宿曰這是大和尚底境界師厲色曰你來為甚偷常住果子喫老宿踧踖而退師大笑歸方丈新到僧參問文殊為甚出女子定不得師曰兵來將攩曰罔明因甚出得師曰水來土掩曰某甲不會師示一頌曰兵來將攩水來土掩羅剎夜叉神頭鬼臉問如何是海底泥牛銜月走師曰石壓筍斜出如何是崖前石虎抱兒眠師曰懸崖花倒生如何是鐵蛇鑽入金剛眼師曰雲開日出如何是崑崙騎象鷺鷥牽師曰雨過苔青曰一切衆生皆有佛性為甚狗子無師曰石人撫掌笑呵呵本空問去卻即今言句乞指本來性空師曰你迷源來得多少時曰即今蒙和尚指示師曰若指示你我即迷源曰如何是空師曰你問我覓曰乞師垂示師示偈曰心是性體性是心用心性一如誰別誰其妄外迷源秖者難洞古今凡聖如幻如夢又曰心不自心性不自性心性齊彰誰體誰用是源源迷非源誰洞老倒本空夢中說夢問文殊為甚出女子定不得師曰巢知風師曰罔明因甚出得師曰穴知雨乃示頌曰巢知風穴知雨直下薦得未可相許既然薦得為甚麼不相許咄若到諸方但恁麼舉
