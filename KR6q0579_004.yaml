body:
  text: 繼住龍山華嚴院嗣法門人行悟等編次普說因事普說人身難得此生莫要空回果能制心一處則無事不辦矣若論此事極是現成所以踏破鐵鞋無覓處得來全不費工夫古人恁麼說話所以棒打石人頭嚗嚗論實事諸兄弟若向此等說話裏留心將去多少省力何勞晝三夜三費許多老力諸兄你自己狂心不歇屢求山僧普說開示且道教山僧說個甚麼我又不會禪道佛法我又不會文字經史是個乾巴巴長老近來善知識如麻似粟何不參去求去學去問去苦哉苦哉休說北方宗風不振南方佛法亦掃地矣非是宗風不振近日遍地多是野狐精魅龍山在南方親近十數員善知識內有多少同參工夫也曉不得做今被諸方瞎禿奴盡情付了也何以故瞎長老見個學者生得幾分人品寫得幾個文字說得幾句話兒也不管他悟不悟就與他一柄如意寫與他一首偈子付了他他時後日少不得是我家兒孫蒼天蒼天正是甜瓜徹蒂甜苦瓜連根苦又有一般沒因緣底長老前生不曾修下福報今生又受不得淡薄遇著個不識羞的學者或拏三十兩五十兩設齊辦供求和尚付了我罷瞎長老也不管他腳跟下了不了即便將錯就錯只圖眼前富貴不顧萬世罵名真地獄種造地獄因萬劫千生無有出期又有一般長老不善守祖庭不肯住茅蓬拖一條棒東走西遊遇著個有緣底住持見他住底好蘭若家裏好器皿結交幾個好施主你來我往烘烘烈烈就起謀心口稱上座滿面春風便言山僧付了你罷貪也洪養坑陷高人若是有筋骨底漢子終不上此等野狐精底圈套若是無主宰底聽得付法滿口承當心生踴躍便言謝和尚慈悲苦哉苦哉且道喚甚麼作佛法付又付個甚麼與者受者同造無間地獄又有一等有因緣底長老集得一千五百衆內有不辭勞苦深為叢林十年二十年百兩千兩化得來供養十方龍象大有功於常住長老見他一片好心便言山僧不孤負你與你一首偈子住山去好受人天供養學人得了偈子如得虎頭金牌一面不識羞醜便言我是付法上座自去稱揚稱鄭面南背北口稱老僧受人天禮拜向古人冊子上念一肚皮機鋒心意識邊想幾句轉語明窗造幾句法語說得攢花簇錦四六成文集一群瞎漢見施主來設齊辦供便去擂鼓敲鐘上堂升座打一場葛藤學者出衆問幾句閒話法座上答幾句機鋒哄騙在家檀越秖圖熱鬧門庭正是一盲引衆盲相牽入火坑未得言得未證言證妄談般若敗壞宗風此等稱善知識喫他施主一粒米穿他施主一縷紗他時後日眼光落地四大分張定要為牛作馬拽耙牽犁償他宿債千佛出世也救他不得以上恁麼付法盡成魔家眷屬更有一等不可說不可說如恆河沙數魔種自稱其德說有談空故此龍蛇混雜玉石難分糊昧學者欺瞞後昆古人傳衣付法以心印心單傳直指不立語言文字秖論明心見性方可傳持大教續佛心燈昔日如來住世說法四十九年末後鷲嶺拈花迦葉微笑佛云我有正法眼藏涅槃妙心付囑摩訶迦葉並不曾說付語言文字智慧聰明並不說付功勞財帛轉語機鋒故古德曰見與師齊減師半德智過於師方堪傳授今人付法單以功勞文字財帛入情貴圖牢籠學者撐持他底門庭所以宗風不振者皆因以上一夥野狐精出頭來稱善知識各霸一方興妖捏怪坑陷人家男女退了無限高人信心諸昆仲若要親近師家必須要具擇法眼若不具擇法眼孤負一生參學虛喪百歲光陰不如向深山窮窟裏饑挑野菜連根煮渴飲清泉水幾鍾早晚念句彌陀佛不枉空門活一生今時又有一般禪和子未行腳時未入叢林時未參禪學道時只知饑來喫飯倦來打眠到是一個好人及至出門參方出一叢林入一保社親近幾個知識學幾句機鋒念幾篇法語想幾個問頭作幾聯詩句逢人便胡說道我是禪師輕慢聖賢空腹高心攪群亂衆敗壞叢林若人肯伊便歡喜若不肯伊便起嗔心嗟乎此等喚作參學造下無邊業因千佛出世也懺悔不得又有一般瞎長老見一個好學者不教他下死心做工夫求個真正悟處終日與他商量公案卜度機鋒描畫樣妄解先宗者一語是那一語非向明窗下學做法語拈弄古今終日在心意識邊作活計正是眼中重著楔腦後更添釘豈不見古人道此事決定不在言句上又道離心意識參絶凡聖路學若不求個真正悟門臨命終時眼光落地四大分張生前狂心未歇死後泉路茫茫轉驢胎闖馬竅莫言龍山不道山僧今日苦勸諸兄今後休學此等焦芽敗種孤負先宗爾等既到龍山這裏必須放下身心也不要你會禪會道也不要你說古談今也不要你精通三教也不要你廣博經文直饒你將三藏十二部一切修多羅念在肚皮裏如瓶瀉水古人道秖名運糞入不名運糞出只要你將無始以來全心盡情死盡無名除盡煩惱斷盡是非掃盡名利忘盡一切妄想攀緣盡情捨盡捨到無可捨處心如太虛空無一法可當情向這裏正好看個話頭如何是佛乾矢橛大慧杲曰喚作竹篦則觸不喚作竹篦則背不得有語不得無語速道速道才開口便打若將此等公案晝三夜三在茲念茲行住坐臥喫飯穿衣念念不捨疑將去參將去參到不參而自參不疑而自疑將三百六十骨節八萬四千毛竅併做一個疑團喫茶不知茶味喫飯不知飯味參得沒撈摸沒滋味心死路絶無處下手正是好底消息切忌不可放過工夫若到這裏譬如萬仞崖前捨得身拚得命一撲撲到底撲得通身粉碎可謂絶後再蘇欺君不得自然歸家穩坐方可說行亦禪坐亦禪動靜語默體安然若到這個境界一任你攪長河為酥酪變大地作黃金自是權衡佛祖號令人天諸兄若到與麼田地真乃名為出家兒若也未到如此且就三條椽下七尺單前高掛鉢囊緊峭草鞋朝參暮請何故直向今生須了卻莫待纍劫受餘殃久立珍重普說山僧今日落堂諸兄請山僧普說且道教山僧開示個甚麼若說禪道佛法山僧不知若要拈古提今山僧不會彼既丈夫我亦爾求人作麼求人不如求己求己不如求心若要成佛作祖須是佛祖心腸始得要作大聖大賢須是聖賢心腸始得豈有衆生心而作佛祖者哉豈有凡夫心而作聖賢者哉諸兄既來親近山僧龍山也不要你拈今弄古也不要你答對吟詩也不要你機鋒轉語也不要你多知多解只要你將無始以來底偷心盡情死盡無明習氣妄想攀緣盡情放下放到無可放處死到無可死處心若大虛空不作虛空之量自然虛而靈空而妙若三二十年把得定做得主行得去祖師門下自有少分相應若是泛泛之流這裏經冬那邊過夏柴不搬一束菜不擇一莖穿長裙子戴高帽子大搖大擺無慚無愧不下死心做工夫只圖向善知識口裏學幾句文書上看幾句心意識邊想幾句逢人便亂說道我是禪師輕慢聖賢空腹高心真地獄種造地獄因千生萬劫無有出期蒼天蒼天正是業識茫茫無本可據禪和子莫莽鹵割愛辭親拋父離母剃髮染衣東走西走出一叢林入一寶所親近知識圖個甚麼莫不是為喫為穿麼莫不是為名為利麼既不為喫為穿又不為名為利終朝走作甚麼莫不是為禪為道麼莫不是為玄為妙麼若道你會禪被禪障會道被道障說玄被玄障說妙被妙障通宗被宗障通教被教障知今被今障識古被古障頗通三教九流會盡諸子百家卻被三教九流諸子百家障直饒你向祖師門下三十年五十年造得事事無礙法法皆真拈來便用處處無心超出三界做個物外閒人便言我是無心道人物外閒人早已障卻道眼了也何故不見古人道知之一字衆禍之門又古人道無為無事人猶是金鎖難又古人道毫釐繫念三途業因瞥爾情生萬劫羈鎖諸仁者還會麼咄五湖四海浪滔滔萬嶺千山雲朵朵酬示法語繞空禪人請示參禪是世間第一件大事因緣不得草草參須真參悟須實悟不得向心意識邊作活計將無始以來底偷心盡情死盡卻不可認作昭昭靈靈動轉施為便是我自家活計臨命終時一些也用不著古人尚幾十年打成一片始肯點胸自許直至末後被明眼人點破去其閨閣中物然悟之一字豈易言哉上座既為生死出家來這裏親近山僧將你向來學得底文書上看得底心意識邊想得底盡情拋向東洋大海裏拋到無可拋處心如虛空無一法可當情方可提個話頭晝三夜三茶裏飯裏發大勇猛起大疑情做將去休管悟不悟直做到水窮山盡虛空粉碎大地平沉無下手處沒滋味處切忌不可放過正是好底消息工夫做到這裏忽然㘞地一聲呀佛法原來不用問人則撫掌一笑宋居士請示若論此事不可以有心求不可以無心會不可以寂默通不可以言語道若以有心求則頭上安頭若以無心會則斬頭覓活若以寂默通則擔雪填井若以語言道則證龜成鱉正恁麼時畢竟作麼生山僧不惜眉毛為你下個注腳昔僧問趙州狗子還有佛性也無州曰無若於無字會得許你開一隻眼若要雙眼圓明待案山點頭卻向你道玉泉居士看楞嚴經身心不安請示人生百歲七十稀況老居士已近八旬早晚看經持咒或看話頭不得十分太過若用心太過心反不安從今以後放下萬緣一味做個無心道人只知饑來喫飯倦來打眠行住坐臥一味平常所以古人道平常心是道老居士若會得平常心是道盡大地是個極樂世界則身心晏然法法寧怗更有何物與汝為冤為對者也印月書記請示兩口無一舌此是我宗旨又曰我宗無語句實無一法與人又曰大統剛宗先須識句若不識句難作個話會言句不透事理不通喚作無孔鐵鎚流俗阿師古人恁麼徹困為人後學不能向此等言句裏直下便了終日秖向心意識邊起模畫樣求玄覓妙殊不知愈求愈遠轉覓轉疏恁麼也不得不恁麼也不得恁麼不恁麼總不得向這裏直下知歸從上此等說話是甚麼破草鞋皆是方便語耳且盡情拈向一邊將自己胸襟中一段蓋天蓋地底光明用出來方可轉三世諸佛向背後雙手叉立歷代祖師喚來洗腳有甚罪過若也未得與麼地且將無量劫來底偷心盡情死盡有生以來學問盡情去盡去到無可去處捨到無可捨處正好看個話頭如何是佛乾矢橛將此話頭頓在面前如貓捕鼠一時不可放過疑將去參將來參得沒滋味沒撈摸無處下手通身是個疑團切切不可放過忽然洗臉摸著鼻孔呀原來舌頭不出口腳腳地上走直饒恁麼悟去龍山拄杖子未肯點頭在何故不見道太平本是將軍定不許將軍見太平機緣問如何是龍山家風師曰當面鑼對面鼓曰師唱誰家曲宗風嗣阿誰師曰逢橋須下馬有路莫登舟曰謝師答話師便打問如何是函蓋乾坤句師曰天清地濁如何是截斷衆流句師曰禹力不到如何是隨波逐浪句師曰日往月來問牛頭未見四祖時如何師曰家貧未是貧曰見後如何師曰路貧愁殺人曰見與不見時如何師曰五里一墩十里一鋪問如何是法身邊事師曰念珠一百八曰如何是法身向上事師曰晝夜轉千回僧參師曰那里來曰五臺來師曰今年文殊在那一臺受供曰臺臺俱有文殊師曰不因上座怎見文殊曰某甲不省和尚說話師曰不因文殊怎見上座僧禮拜師曰文殊文殊曰切忌眼花師曰可惜錯過文殊一僧入室請益值師寫字便作禮師曰何為曰請益師舉筆示之僧禮拜師曰不妨伶俐僧擬議師喝出又一僧入師亦舉筆示之曰會麼僧喝師曰不妨伶俐僧亦擬議師亦喝出師顧侍僧曰這兩個師僧一人解放不解收一人解收不解放你還知麼侍無語師曰山僧今日失利一日師進堂曰凡參禪須離心意識參絶凡聖路學一僧出問秖如離了心意識向那裏下手參師以竹篦地上畫一相曰揀來呈似山僧看僧擬議師打曰這個尚且不能下手說什離